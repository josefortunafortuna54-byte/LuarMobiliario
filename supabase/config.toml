# Supabase config.toml — Luar Company Imobiliária
# Usado pelo `supabase start` (local) e `supabase db push` (projeto ligado).
# NOTA: `verify_jwt = false` nas funções é irrelevante porque a entrega FCM
# depende da chave de servidor secreta; o RPC continua a validar permissões.

project_id = "luar-company-mobiliario"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[realtime]
enabled = true

[analytics]
enabled = false

[functions]
enabled = true
verify_jwt = false