name: Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: luar_company

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --concurrency=2

  integration-test:
    name: Integration Tests (Android emulator)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          working-directory: luar_company
          script: flutter test integration_test

  build-apk:
    name: Build Signed Release APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secreto de assinatura ausente (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD). Um APK assinado com a chave de debug nao pode ser instalado sobre versoes de release ('App nao instalado'). Configure os secrets antes de distribuir."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/android.jks
          cat > android/key.properties <<EOF
          storeFile=android.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured."
          keytool -list -v -keystore android/app/android.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -E "Alias name|SHA256:" || echo "::warning::Nao foi possivel imprimir o fingerprint do keystore."

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        timeout-minutes: 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=FCM_SENDER_ID="${{ secrets.FCM_SENDER_ID }}" \
            --dart-define=FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}" \
            --dart-define=FCM_API_KEY="${{ secrets.FCM_API_KEY }}" \
            --dart-define=FCM_APP_ID="${{ secrets.FCM_APP_ID }}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "SHA-256 do APK: $(sha256sum "$APK" | cut -d' ' -f1)"
          "${ANDROID_HOME}/build-tools/"*/apksigner verify --print-certs "$APK" 2>/dev/null | grep "SHA-256 digest" || true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: luar-mobiliario-apk-${{ github.run_number }}
          path: luar_company/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-aab:
    name: Build Signed Release AAB (Play Store)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secreto de assinatura ausente (KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD). AAB assinado com a chave de debug nao pode ser publicado. Configure os secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/android.jks
          cat > android/key.properties <<EOF
          storeFile=android.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured."

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle
        timeout-minutes: 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=FCM_SENDER_ID="${{ secrets.FCM_SENDER_ID }}" \
            --dart-define=FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}" \
            --dart-define=FCM_API_KEY="${{ secrets.FCM_API_KEY }}" \
            --dart-define=FCM_APP_ID="${{ secrets.FCM_APP_ID }}"

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: luar-mobiliario-aab-${{ github.run_number }}
          path: luar_company/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-web:
    name: Build & Deploy Web
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release --base-href "/LuarMobiliario/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=FCM_SENDER_ID="${{ secrets.FCM_SENDER_ID }}" \
            --dart-define=FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}" \
            --dart-define=FCM_API_KEY="${{ secrets.FCM_API_KEY }}" \
            --dart-define=FCM_APP_ID="${{ secrets.FCM_APP_ID }}"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: luar_company/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
